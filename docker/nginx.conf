worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    client_max_body_size 16M;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # JSON API responses stay small, but CORS preflight and error pages are
    # still headers-heavy; keep generous buffers.
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    fastcgi_buffer_size 32k;
    fastcgi_buffers 16 32k;
    fastcgi_busy_buffers_size 64k;
    large_client_header_buffers 4 32k;

    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 1024;

    server {
        listen 80;

        root /var/www/html/public;
        index index.php;

        charset utf-8;

        # Storage symlink target when the local media disk is used.
        location /storage/ {
            try_files $uri =404;
            expires 30d;
        }

        # Uploaded files are served from the object storage URL in production;
        # keep /images working for rows that still hold a relative path.

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            fastcgi_hide_header X-Powered-By;
            fastcgi_read_timeout 120s;
            include fastcgi_params;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
